# Research page: one section per project, listed in the order written here.
# Papers are pulled from _data/publications.yml by their `id`, so each paper
# is written once and shows on both pages.
#
# Example entry:
# - id: "project-short-name"                         # anchor, link as /research/#project-short-name
#   title: "Project name"
#   tagline: "One sentence on what the project is"     # optional; shown under the title
#   image: "/assets/img/research/example.webp"       # optional figure
#   summary: >-                                      # optional; Markdown
#     One or two paragraphs about the project.
#   links:                                           # optional; demos, slides, code
#     - label: "Slides"
#       url: "/assets/files/talk-slides.pdf"
#   publications: [paper-short-name]                 # ids from _data/publications.yml;
#                                                    # use its `unlisted` section to keep a paper off /publications/

- id: "tblt-agent"
